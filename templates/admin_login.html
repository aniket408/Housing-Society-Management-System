<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Housing Society</title>
    <link rel="stylesheet" href="/static/css/admin_login.css">
    
</head>

 <!DOCTYPE html> <html> <head> <title>Navbar</title> <link rel="stylesheet" href="/static/css/member_navbar.css"> </head> <body> <nav class="navbar"> <div class="logo"> <a href="/index/">Society<span>Pro</span></a> </div> <ul class="nav-links"> <li><a href="/index/">Home</a></li> <li><a href="/index/" class="logout">Logout</a></li> </ul> </nav> </body> </html>

<body>

<div class="login-box">
    <h2>ADMIN LOGIN</h2>

    <form id="admin" name="admin_login" action="/action/admin_login/" method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit" name="submit" value="Login" class="login-btn">Login</button>

       

        <a href="#" class="forgot">Forgot Password?</a>
    </form>
</div>

</body>
</html>
