
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Login - Housing Society</title>

 <!DOCTYPE html> <html> <head> <title>Navbar</title> <link rel="stylesheet" href="/static/css/member_navbar.css"> </head> <body> <nav class="navbar"> <div class="logo"> <a href="/index/">Society<span>Pro</span></a> </div> <ul class="nav-links"> <li><a href="/index/">Home</a></li> <li><a href="/index/" class="logout">Logout</a></li> </ul> </nav> </body> </html>



<body>

<div class="login-box">
    <h2>MEMBER LOGIN</h2>

    <form id="member" name="member_login" action="/action/member_login/" method="post">
        {% csrf_token %}

        
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit" name="submit" value="Login">Login</button>

        <a href="#">Forgot Password?</a>

        <!-- MEMBER REGISTRATION BUTTON -->
          <a href="/member_register/" class="New Member Register" name="submit" value="NewMemberRegister">New Member Register</a>
        </a>

    </form>
</div>

</body>
</html>
