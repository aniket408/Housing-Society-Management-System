<body>

<div class="bill-box">
    <h2>MAINTENANCE BILL</h2>

    <form id="admin" name="admin_maintenance_bill" action="/action/admin_maintenance_bill/" method="post">
        {% csrf_token %}

        <div class="row two">
            <div>
                <label>Month:</label>
                <input type="text" placeholder="Month" name="month">
            </div>
            <br>
            <div>
            
                <label>Year:</label>
                <input type="text" placeholder="Year" name="year">
            </div>
            <br>
        </div>
        <br><br>

       
        <div class="row">
            <label>Amount:</label>
            <input type="text" placeholder="Enter Amount" name="amount">
        </div>

        <div class="btn-row">
            <button type="submit" class="generate" name="submit" value="admin_maintenance_bill">Generate Bill</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>
</div>

</body>
