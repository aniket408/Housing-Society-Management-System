<body>
		
<form name="member_profile"action="/action/member_profile/" method="post"  id="member_profile" >
        {% csrf_token %}

    <div class="profile-box">
        <h2>MEMBER PROFILE</h2>

        <div class="row">
            <label for="name">Name:</label>
            <input type="text" name="name" value="">
        </div>

        <div class="row two">
            <div>
                <label for="flat_no">Flat No:</label>
                <input type="text" name="flat_no" value="">

<br><br>
            <div>
                <label for="wing">Wing:</label>

            </div>
        </div>

        </div>
        
        <div class="row">

            <input type="email" name="email_id" value="">
        </div>
			
        <div class="btn-row">

        </div>
        
    </div>
