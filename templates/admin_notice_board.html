<body>

<div class="notice-box">
    <h2>NOTICE BOARD</h2>
    <br>

    <form id="admin" name="admin_notice_board" action="/action/admin_notice_board/" method="post">
        {% csrf_token %}
        <div class="row">
            <div>
                <label>Date :</label>
                <input type="date" name="data">
            </div>

            <br><br>

            <!-- NOTICE NAME ROW ADDED -->
            <div>
                <label>Notice Name :</label>
                <input type="text" placeholder="Enter notice name" name="notice_name">
            </div>

            <br><br>

            <div>
                <label>Notice :</label>
                <input type="text" placeholder="Enter notice here" name="notice">
            </div>
        </div>

        <div class="buttons">
            <button type="submit" value="admin_notice_board" name="submit" class="add">
                ADD NOTICE
            </button>

            <button type="submit" class="edit">
                EDIT NOTICE
            </button>

            <button type="submit" class="delete">
                DELETE NOTICE
            </button>
        </div>

    </form>
</div>

</body>
</html>
