
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Registration</title>
    <link rel="stylesheet" href="/static/css/admin_register.css">
    
</head>
 <!DOCTYPE html> <html> <head> <title>Navbar</title> <link rel="stylesheet" href="/static/css/member_navbar.css"> </head> <body> <nav class="navbar"> <div class="logo"> <a href="/index/">Society<span>Pro</span></a> </div> <ul class="nav-links"> <li><a href="/index/">Home</a></li> <li><a href="/index/" class="logout">Logout</a></li> </ul> </nav> </body> </html>


<body>

<div class="register-box">
    <h2>ADMIN REGISTRATION FORM</h2>

    <form id="admin" name="admin_register" action="/action/admin_register/" method="post">
        {% csrf_token %}

        <label>Society Name</label>
        <input type="text" name="society" placeholder="Enter society name" required>

        <label>Admin Name</label>
        <input type="text" name="adminname" placeholder="Enter admin full name" required>

        <label>Contact No</label>
        <input type="text" name="contact" placeholder="Enter 10-digit mobile number" required>

        <label>Email ID</label>
        <input type="email" name="email" placeholder="Enter valid email address" required>

        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create strong password" required>

        <label>Confirm Password</label>
        <input type="password" name="cpassword" placeholder="Re-enter password" required>

        <div class="buttons">
            <button type="submit" value="admin_register" name="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>
</div>

</body>
</html>
